# ==============================================================================
# Kodewaves Sovereign Voice AI — aaPanel & VPS Production Compose
# Designed specifically to run alongside aaPanel / Nginx Host
# Uses localhost-bound ports to prevent conflicts with aaPanel Port 80/443
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kodewaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secure_pass}"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kodewaves_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - kodewaves-network

  redis:
    image: redis:7-alpine
    container_name: kodewaves_redis
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - kodewaves_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - kodewaves-network

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    image: kodewaves-minio:latest
    container_name: kodewaves_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_SCANNER_SPEED: "slow"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kodewaves_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - kodewaves-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: kodewaves-api:latest
    container_name: kodewaves_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      PUBLIC_HOST: "${PUBLIC_HOST:-your-domain.com}"
      BACKEND_API_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      FORWARDED_ALLOW_IPS: "*"
      
      # Database and Cache
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379"

      # Master Encryption & JWT Secrets
      OSS_JWT_SECRET: "${OSS_JWT_SECRET}"
      JWT_SECRET: "${OSS_JWT_SECRET}"
      MASTER_CREDENTIAL_ENCRYPTION_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY}"
      KODEWAVES_SECRET_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # Local Sovereign Storage
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}/voice-audio"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Process Workers & Lean Resource Allocation
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
      ENABLE_ARI_MANAGER: "${ENABLE_ARI_MANAGER:-false}"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "${ENABLE_CAMPAIGN_ORCHESTRATOR:-false}"

      # OpenMP, PyTorch, & BLAS CPU Thread Throttling (Prevents idle CPU pegging)
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_WAIT_POLICY: "PASSIVE"
      TORCH_NUM_THREADS: "1"
      KMP_BLOCKTIME: "0"
      GOMP_SPINCOUNT: "0"
      KMP_AFFINITY: "disabled"

      # WebRTC NAT Traversal (STUN / TURN)
      ENABLE_COTURN: "${ENABLE_COTURN:-true}"
      TURN_HOST: "${PUBLIC_HOST:-your-domain.com}"
      TURN_SECRET: "${TURN_SECRET:-coturn_shared_secret}"

      # Local CPU AI Engine (Ollama + Piper TTS)
      OLLAMA_ENDPOINT: "${OLLAMA_ENDPOINT:-http://ollama:11434}"
      PIPER_ENDPOINT: "${PIPER_ENDPOINT:-http://piper:5000}"
      ENABLE_LOCAL_AI_ENGINE: "${ENABLE_LOCAL_AI_ENGINE:-true}"

      # DevOps / Monitoring Secret
      KODEWAVES_DEVOPS_SECRET: "${KODEWAVES_DEVOPS_SECRET:-}"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api:ro
      - ./scripts:/app/scripts:ro
      - ./pipecat:/app/pipecat:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2048M
    networks:
      - kodewaves-network

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: kodewaves-ui:latest
    container_name: kodewaves_ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3010"
      NODE_ENV: "production"
      NEXT_PUBLIC_NODE_ENV: "oss"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      BACKEND_URL: "http://api:8000"
    ports:
      - "127.0.0.1:${UI_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3010/api/health || curl -f http://localhost:3010/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - kodewaves-network

  # WebRTC NAT Traversal (STUN / TURN) for browser audio testing behind symmetric NAT
  coturn:
    image: coturn/coturn:4.8.0
    container_name: kodewaves_coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${PUBLIC_HOST:-localhost}
      - --static-auth-secret=${TURN_SECRET:-coturn_shared_secret}
    environment:
      TURN_SECRET: "${TURN_SECRET:-coturn_shared_secret}"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49350:49152-49350/udp"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - kodewaves-network

  # ==============================================================================
  # Ultra-Lightweight Self-Hosted CPU Local AI Engine (Optional / Admin Opt-In)
  # Uses CPU-only inference with strict memory limits to protect low-RAM VPS.
  # ==============================================================================
  ollama:
    image: ollama/ollama:0.6.2
    container_name: kodewaves_ollama
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - kodewaves_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          memory: 2048M
    networks:
      - kodewaves-network

  # Piper Neural TTS HTTP Server (OHF-Voice/piper1-gpl)
  piper:
    build:
      context: .
      dockerfile: deploy/piper/Dockerfile
    image: kodewaves-piper:latest
    container_name: kodewaves_piper
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:${PIPER_PORT:-8766}:5000"
    volumes:
      - kodewaves_piper_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/voices"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - kodewaves-network

  # Faster-Whisper Local STT Server (CTranslate2 CPU inference, OpenAI-compatible /v1/audio/transcriptions)
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.4.1-cpu
    container_name: kodewaves_whisper
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8765}:8000"
    volumes:
      - kodewaves_whisper_cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - PRELOAD_MODELS=Systran/faster-whisper-tiny
      - DEFAULT_DEVICE=cpu
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 768M
    networks:
      - kodewaves-network

volumes:
  kodewaves_postgres_data:
  kodewaves_redis_data:
  kodewaves_minio_data:
  kodewaves_ollama_data:
  kodewaves_piper_data:
  kodewaves_whisper_cache:

networks:
  kodewaves-network:
    driver: bridge


