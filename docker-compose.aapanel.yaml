# ==============================================================================
# Kodewaves Sovereign Voice AI — aaPanel & VPS Production Compose
# Designed specifically to run alongside aaPanel / Nginx Host
# Uses localhost-bound ports to prevent conflicts with aaPanel Port 80/443
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kodewaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secure_pass}"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kodewaves_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kodewaves-network

  redis:
    image: redis:7-alpine
    container_name: kodewaves_redis
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kodewaves_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kodewaves-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: kodewaves_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kodewaves_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kodewaves-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: kodewaves-api:latest
    container_name: kodewaves_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      PUBLIC_HOST: "${PUBLIC_HOST:-your-domain.com}"
      BACKEND_API_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      
      # Database and Cache
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379"

      # Master Encryption & JWT Secrets
      OSS_JWT_SECRET: "${OSS_JWT_SECRET}"
      MASTER_CREDENTIAL_ENCRYPTION_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # Local Sovereign Storage
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}/voice-audio"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Process Workers
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-2}"
      ENABLE_ARI_MANAGER: "true"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app/api:ro
      - ./pipecat:/app/pipecat:ro
      - ./scripts:/app/scripts:ro
    networks:
      - kodewaves-network

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: kodewaves-ui:latest
    container_name: kodewaves_ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3010"
      NODE_ENV: "production"
      NEXT_PUBLIC_NODE_ENV: "oss"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      BACKEND_URL: "http://api:8000"
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - kodewaves-network

volumes:
  kodewaves_postgres_data:
  kodewaves_redis_data:
  kodewaves_minio_data:

networks:
  kodewaves-network:
    driver: bridge
