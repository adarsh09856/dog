# ==============================================================================
# Kodewaves Sovereign Voice AI — aaPanel & VPS Production Compose
# Designed specifically to run alongside aaPanel / Nginx Host
# Uses localhost-bound ports to prevent conflicts with aaPanel Port 80/443
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kodewaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secure_pass}"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kodewaves_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - kodewaves-network

  redis:
    image: redis:7-alpine
    container_name: kodewaves_redis
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - kodewaves_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - kodewaves-network

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    image: kodewaves-minio:v1.0.0
    container_name: kodewaves_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_SCANNER_SPEED: "slow"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kodewaves_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - kodewaves-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: kodewaves-api:v2.0.0
    container_name: kodewaves_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      PUBLIC_HOST: "${PUBLIC_HOST:-your-domain.com}"
      BACKEND_API_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      FORWARDED_ALLOW_IPS: "*"
      
      # Database and Cache
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379"

      # Master Encryption & JWT Secrets
      OSS_JWT_SECRET: "${OSS_JWT_SECRET}"
      JWT_SECRET: "${OSS_JWT_SECRET}"
      MASTER_CREDENTIAL_ENCRYPTION_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY}"
      KODEWAVES_SECRET_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # Local Sovereign Storage
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      # MinioFileSystem appends the bucket path itself. The reverse proxy exposes
      # /voice-audio/<object> on this origin.
      MINIO_PUBLIC_ENDPOINT: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_secure_pass}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Process Workers & Lean Resource Allocation
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
      ENABLE_ARI_MANAGER: "${ENABLE_ARI_MANAGER:-false}"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "${ENABLE_CAMPAIGN_ORCHESTRATOR:-true}"

      # OpenMP, PyTorch, & BLAS CPU Thread Throttling (Prevents idle CPU pegging)
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_WAIT_POLICY: "PASSIVE"
      TORCH_NUM_THREADS: "1"
      KMP_BLOCKTIME: "0"
      GOMP_SPINCOUNT: "0"
      KMP_AFFINITY: "disabled"

      # WebRTC NAT Traversal (STUN / TURN)
      ENABLE_COTURN: "${ENABLE_COTURN:-true}"
      TURN_HOST: "${PUBLIC_HOST:-your-domain.com}"
      TURN_SECRET: "${TURN_SECRET:-coturn_shared_secret}"

      # Local CPU AI Engine (Ollama + Indus TTS + Faster-Whisper STT)
      OLLAMA_ENDPOINT: "${OLLAMA_ENDPOINT:-http://ollama:11434}"
      WHISPER_ENDPOINT: "${WHISPER_ENDPOINT:-http://whisper:8000/v1}"
      INDIC_STT_ENDPOINT: "${INDIC_STT_ENDPOINT:-http://indic-stt:8000/v1}"
      INDUS_TTS_ENDPOINT: "${INDUS_TTS_ENDPOINT:-http://indus-tts:8000/v1}"
      INDIC_MIO_TTS_ENDPOINT: "${INDIC_MIO_TTS_ENDPOINT:-http://indic-mio-tts:8000/v1}"
      ENABLE_LOCAL_AI_ENGINE: "${ENABLE_LOCAL_AI_ENGINE:-true}"
      KODEWAVES_DEFAULT_REGION: "${KODEWAVES_DEFAULT_REGION:-IN}"
      KODEWAVES_DEFAULT_TIMEZONE: "${KODEWAVES_DEFAULT_TIMEZONE:-Asia/Kolkata}"

      # DevOps / Monitoring Secret
      KODEWAVES_DEVOPS_SECRET: "${KODEWAVES_DEVOPS_SECRET:-}"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api:ro
      - ./scripts:/app/scripts:ro
      - ./pipecat:/app/pipecat:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\" || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2048M
    networks:
      - kodewaves-network

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: kodewaves-ui:v2.0.0
    container_name: kodewaves_ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      NEXT_PUBLIC_NODE_ENV: "oss"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: "${PUBLIC_BASE_URL:-https://your-domain.com}"
      BACKEND_URL: "http://api:8000"
    ports:
      - "127.0.0.1:${UI_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - kodewaves-network

  # WebRTC NAT Traversal (STUN / TURN) for browser audio testing behind symmetric NAT
  coturn:
    image: coturn/coturn:4.8.0
    container_name: kodewaves_coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${PUBLIC_HOST:-localhost}
      - --static-auth-secret=${TURN_SECRET:-coturn_shared_secret}
    environment:
      TURN_SECRET: "${TURN_SECRET:-coturn_shared_secret}"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49350:49152-49350/udp"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - kodewaves-network

  # ==============================================================================
  # Ultra-Lightweight Self-Hosted CPU Local AI Engine (Optional / Admin Opt-In)
  # Uses CPU-only inference with strict memory limits to protect low-RAM VPS.
  # ==============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: kodewaves_ollama
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - kodewaves_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4096M
        reservations:
          memory: 2048M
    networks:
      - kodewaves-network

  ollama-warmup:
    image: python:3.13-alpine
    restart: unless-stopped
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_ENDPOINT: http://ollama:11434
      OLLAMA_WARM_MODELS: "${OLLAMA_WARM_MODELS:-qwen3.5:2b}"
      OLLAMA_WARM_INTERVAL_SECONDS: "${OLLAMA_WARM_INTERVAL_SECONDS:-30}"
    command: ["python", "/app/warm_local_ollama.py"]
    volumes:
      - ./scripts/warm_local_ollama.py:/app/warm_local_ollama.py:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks:
      - kodewaves-network

  # Fast CPU-native Indian Hindi/Hinglish conversational TTS (Inaya voice).
  indus-tts:
    build:
      context: ./api/local_models/indus_tts
      dockerfile: Dockerfile
    image: kodewaves-indus-tts:v1.0.0
    container_name: kodewaves_indus_tts
    restart: unless-stopped
    profiles: ["local"]
    environment:
      HF_HOME: /models/huggingface
      INDUS_MODEL_DIR: /models/indus-pocket-tts
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - kodewaves_indus_tts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          memory: 768M
    networks:
      - kodewaves-network

  # Faster-Whisper Local STT Server (CTranslate2 CPU inference, OpenAI-compatible /v1/audio/transcriptions)
  indic-stt:
    build:
      context: ./api/local_models/indic_stt
    image: kodewaves-indic-stt:v1.0.0
    container_name: kodewaves_indic_stt
    restart: unless-stopped
    environment:
      INDIC_STT_LANGUAGES: "${INDIC_STT_LANGUAGES:-all}"
      INDIC_STT_THREADS: "${INDIC_STT_THREADS:-2}"
    volumes:
      - kodewaves_indic_stt_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - kodewaves-network

  # CPU LiteRT Indic-Mio TTS, with Indian-language and English voice support.
  # This model buffers utterances, so keep it distinct from the streaming voice.
  indic-mio-tts:
    build:
      context: ./api/local_models/indic_mio
      dockerfile: Dockerfile
    image: kodewaves-indic-mio-tts:v1.0.0
    container_name: kodewaves_indic_mio_tts
    restart: "no"
    profiles: ["indic-mio"]
    environment:
      HF_HOME: /models/huggingface
      INDIC_MIO_MODEL_DIR: /models/indic-mio
      OMP_NUM_THREADS: "2"
      TFLITE_NUM_THREADS: "2"
    volumes:
      - kodewaves_indic_mio_tts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 12288M
        reservations:
          memory: 2048M
    networks:
      - kodewaves-network

  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: kodewaves_whisper
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8765}:8000"
    volumes:
      - kodewaves_whisper_cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - PRELOAD_MODELS=${WHISPER_PRELOAD_MODELS:-Systran/faster-whisper-small}
      - DEFAULT_DEVICE=cpu
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - WHISPER__TTL=${WHISPER_MODEL_TTL:--1}
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER__CPU_THREADS=${WHISPER_CPU_THREADS:-3}
      - WHISPER__NUM_WORKERS=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -sS -o /dev/null -w '%{http_code}' -X POST 'http://localhost:8000/api/ps/Systran%2Ffaster-whisper-small'); [ \"$$code\" = 200 ] || [ \"$$code\" = 409 ]",
        ]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3072M
        reservations:
          memory: 1024M
    networks:
      - kodewaves-network

volumes:
  kodewaves_postgres_data:
  kodewaves_redis_data:
  kodewaves_minio_data:
  kodewaves_ollama_data:
  kodewaves_whisper_cache:
  kodewaves_indic_stt_models:
  kodewaves_indus_tts_models:
  kodewaves_indic_mio_tts_models:

networks:
  kodewaves-network:
    driver: bridge


