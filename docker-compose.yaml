# Kodewaves deployment stack — driven by the helper scripts, not by a bare
# `docker compose up`.
#
# This stack needs a generated .env (secrets, public host/URL) and, for the
# remote/TURN profiles, runtime nginx/coturn config rendered by the kodewaves-init
# service. The setup scripts create those for you — start with them:
#
#   Local:          ./start_docker.sh        (Windows: .\start_docker.ps1)
#   Remote server:  sudo ./setup_remote.sh   then ./remote_up.sh
#
# Running `docker compose up` against a fresh checkout will fail or come up
# misconfigured (e.g. OSS_JWT_SECRET is required). Full guide:
# https://docs.kodewaves.com/deployment/docker

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      # Sourced from .env. Defaults to "postgres"
      # NOTE: changing this on an existing install does NOT
      # re-key the database — the password is baked into the volume on first init.
      # You can manually change the password using psql in the container
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: >
      --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    image: kodewaves-minio:local
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000" # Bind to localhost explicitly
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kodewaves-init:
    image: bash:5.2
    container_name: kodewaves_init
    profiles: ["remote", "local-turn"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      SERVER_IP: "${SERVER_IP:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./deploy:/workspace/deploy:ro
      - ./certs:/certs:ro
      - nginx-generated:/generated/nginx
      - coturn-generated:/generated/coturn
    command:
      - /workspace/scripts/run_kodewaves_init.sh

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_https
    profiles: ["remote"]
    depends_on:
      kodewaves-init:
        condition: service_completed_successfully
      ui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-generated:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      app-network:
        ipv4_address: "${NGINX_IPV4:-172.30.0.2}"

  coturn:
    image: coturn/coturn:4.8.0
    container_name: coturn
    restart: unless-stopped
    profiles: ["remote", "local-turn"]
    depends_on:
      kodewaves-init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - coturn-generated:/etc/coturn:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
    networks:
      - app-network

  api:
    image: ${REGISTRY:-kodewaves}/kodewaves-api:${VERSION:-v2.0.0}
    environment:
      # Core application config
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "INFO"
      KODEWAVES_EDITION: "${KODEWAVES_EDITION:-saas}"
      # Client editions require an owner-signed license. The owner signing key
      # must never be added here or shipped in client installation files.
      KODEWAVES_LICENSE_TOKEN: "${KODEWAVES_LICENSE_TOKEN:-}"
      KODEWAVES_LICENSE_PUBLIC_KEY: "${KODEWAVES_LICENSE_PUBLIC_KEY:-}"
      KODEWAVES_INSTALLATION_ID: "${KODEWAVES_INSTALLATION_ID:-}"

      # Set to "false" in .env to disable public signup (invite-only installs).
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"

      # Public origin for this deployment. The API derives BACKEND_API_ENDPOINT,
      # MINIO_PUBLIC_ENDPOINT and TURN_HOST from PUBLIC_BASE_URL / PUBLIC_HOST when
      # they are not set explicitly (see api/constants.py), so a standard remote
      # install only needs PUBLIC_BASE_URL + PUBLIC_HOST in .env.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      # Public origin used when generating copy-paste widget snippets.
      UI_APP_URL: "${UI_APP_URL:-}"

      # Optional explicit override of the public URL the backend builds webhook /
      # embed links from. Defaults to PUBLIC_BASE_URL. When the value is non-public
      # (localhost or a private/reserved IP), the API resolves a running Cloudflare
      # tunnel's URL at runtime instead (see api/utils/common.py).
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-}"

      # Database configuration (using containerized postgres)
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres"

      # Redis configuration (using containerized redis)
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redissecret}@redis:6379"

      # Storage configuration - bundled MinIO by default. Set ENABLE_AWS_S3=true
      # in .env to make the API use AWS S3 or another S3-compatible server.
      ENABLE_AWS_S3: "${ENABLE_AWS_S3:-false}"

      # S3 backend configuration. Compose's .env file is used for interpolation,
      # but those values are not automatically injected into containers, so pass
      # the S3 settings through explicitly.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"

      # For a non-AWS S3-compatible server, also set these in Compose's .env
      # S3_ENDPOINT_URL        e.g. https://s3.example.com
      # S3_SIGNATURE_VERSION   set "s3v4" if the server requires SigV4 (e.g. rustfs)
      # S3_ADDRESSING_STYLE    set "path" if the server / TLS cert requires path-style
      # The S3 backend issues real presigned URLs, so the bucket can stay private.
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"

      # MinIO
      MINIO_ENDPOINT: "minio:9000"
      # Full URL (with scheme) browsers use to reach MinIO. Defaults to
      # PUBLIC_BASE_URL for remote deployments (nginx proxies /voice-audio/) and to
      # http://localhost:9000 for local; override only for a separate object store.
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Number of uvicorn worker processes (each is its own process bound to a
      # distinct port starting at 8000). kodewaves-init renders nginx upstreams
      # from this value and nginx load-balances across them with least_conn.
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"

      # Optional singleton background services started by the container CMD
      # (scripts/start_services_docker.sh). Both default to on; set either to
      # "false" in .env to run this container as an API/worker node only — e.g. a
      # scale-out replica that must not also run the telephony ARI bridge
      # (ari_manager) or the outbound campaign loop (campaign_orchestrator).
      ENABLE_ARI_MANAGER: "${ENABLE_ARI_MANAGER:-true}"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "${ENABLE_CAMPAIGN_ORCHESTRATOR:-true}"

      # Scrape /api/v1/metrics on each worker's own port. See deploy/observability.
      ENABLE_PROMETHEUS_METRICS: "${ENABLE_PROMETHEUS_METRICS:-false}"
      KODEWAVES_DEVOPS_SECRET: "${KODEWAVES_DEVOPS_SECRET:-${DOGRAH_DEVOPS_SECRET:-}}"
      DOGRAH_DEVOPS_SECRET: "${KODEWAVES_DEVOPS_SECRET:-${DOGRAH_DEVOPS_SECRET:-}}"

      # Trust HTTPS/XFF headers only from the bundled nginx ingress. Wildcard
      # trust lets clients spoof X-Forwarded-For and can bypass owner IP policy.
      FORWARDED_ALLOW_IPS: "${NGINX_IPV4:-172.30.0.2}"

      # Langfuse — credentials can be set here or per-organization via the UI
      # at /settings. Tracing is automatically active when credentials are
      # available; uncomment to set defaults for all organizations.
      # LANGFUSE_SECRET_KEY: ""
      # LANGFUSE_PUBLIC_KEY: ""
      # LANGFUSE_HOST: ""
      # LANGFUSE_PROJECT_ID: ""
      # Traces are private by default. Set to "true" to make traces in the
      # project above readable by anyone holding the trace URL, with no
      # Langfuse login. Organizations that connected their own Langfuse project
      # in the UI carry their own visibility setting instead.
      LANGFUSE_TRACES_PUBLIC: "${LANGFUSE_TRACES_PUBLIC:-false}"

      # TURN server configuration (for WebRTC NAT traversal in remote server)
      # Uses time-limited credentials via TURN REST API (HMAC-SHA1).
      ENABLE_COTURN: "${ENABLE_COTURN:-false}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"
      SERVER_IP: "${SERVER_IP:-}"

      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET must be set to a strong secret}"
      JWT_SECRET: "${OSS_JWT_SECRET}"
      MASTER_CREDENTIAL_ENCRYPTION_KEY: "${MASTER_CREDENTIAL_ENCRYPTION_KEY:-}"
      OLLAMA_ENDPOINT: "${OLLAMA_ENDPOINT:-http://ollama:11434}"
      # Set the local LLM's inference thread budget independently of API workers.
      OLLAMA_NUM_THREADS: "${OLLAMA_NUM_THREADS:-3}"
      WHISPER_ENDPOINT: "${WHISPER_ENDPOINT:-http://whisper:8000/v1}"
      INDIC_STT_ENDPOINT: "${INDIC_STT_ENDPOINT:-http://indic-stt:8000/v1}"
      INDIC_MIO_TTS_ENDPOINT: "${INDIC_MIO_TTS_ENDPOINT:-http://indic-mio-tts:8000/v1}"
      INDIC_PARLER_TTS_ENDPOINT: "${INDIC_PARLER_TTS_ENDPOINT:-http://indic-parler-tts:8000/v1}"
      INDIC_VITS_TTS_ENDPOINT: "${INDIC_VITS_TTS_ENDPOINT:-http://indic-vits-tts:8000/v1}"
      INDUS_COMBINED_ENDPOINT: "${INDUS_COMBINED_ENDPOINT:-}"
      DHVAANI_TTS_ENDPOINT: "${DHVAANI_TTS_ENDPOINT:-http://dhvaani-tts:8000/v1}"
      ENABLE_LOCAL_AI_ENGINE: "${ENABLE_LOCAL_AI_ENGINE:-true}"
      KODEWAVES_DEFAULT_REGION: "${KODEWAVES_DEFAULT_REGION:-IN}"
      KODEWAVES_DEFAULT_TIMEZONE: "${KODEWAVES_DEFAULT_TIMEZONE:-Asia/Kolkata}"

      # Telephony media WebSocket capability token. The carrier dials the media
      # socket back, so its URL is caller-visible and the ids in it are otherwise
      # guessable. Set a secret in .env to have providers sign that URL and the
      # handler verify it; leave it unset and nothing changes. Roll out in two
      # steps: set the secret first (invalid tokens are logged but allowed), then
      # set ENFORCE=true once the logs stay clean.
      TELEPHONY_WS_TOKEN_SECRET: "${TELEPHONY_WS_TOKEN_SECRET:-}"
      TELEPHONY_WS_TOKEN_ENFORCE: "${TELEPHONY_WS_TOKEN_ENFORCE:-false}"

      # Telemetry
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-true}"
      POSTHOG_API_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.i.posthog.com"

    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        KODEWAVES_EDITION: "${KODEWAVES_EDITION:-saas}"
    image: ${REGISTRY:-kodewaves}/kodewaves-ui:${VERSION:-v2.0.0}
    restart: unless-stopped
    environment:
      # Bind the Next.js standalone server to all interfaces
      HOSTNAME: "0.0.0.0"
      KODEWAVES_EDITION: "${KODEWAVES_EDITION:-saas}"

      # Server-side URL (SSR, internal Docker network)
      BACKEND_URL: "${BACKEND_URL:-http://api:8000}"
      NODE_ENV: "oss"

      # Flag to enable/ disable posthog
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-true}"

      # Posthog
      POSTHOG_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.posthog.com"
    ports:
      - "127.0.0.1:${UI_PORT:-3010}:3010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3010/api/health || curl -f http://127.0.0.1:3010/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network
      # aaPanel runs the API in its own Compose project. Keep UI reachable by
      # the API's fallback proxy, and allow UI to resolve that API service.
      - kodewaves-shared

  # Cloudflare tunnel for inbound webhook / WSS reachability when the host has no
  # usable public IP (behind NAT or a firewall). Gated behind the "tunnel" profile
  # so public-IP installs (served directly by nginx) never start it, and the api
  # service no longer hard-depends on it. Two modes, chosen by the token:
  #   - CLOUDFLARE_TUNNEL_TOKEN set  -> named tunnel with a stable hostname. Point
  #     its ingress at http://api:8000 in the Cloudflare dashboard and set
  #     BACKEND_API_ENDPOINT in .env to that hostname.
  #   - token unset                  -> quick tunnel with an ephemeral
  #     *.trycloudflare.com URL the API discovers from the metrics endpoint
  #     (api/utils/tunnel.py). Convenient for local dev.
  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: cloudflared-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      # cloudflared automatically picks up the token from TUNNEL_TOKEN when
      # running `tunnel run`. Leave empty to fall back to a quick tunnel.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    # The cloudflared image is distroless (no `sh`), so a `sh -c` conditional
    # entrypoint can't run. The image's own entrypoint is already
    # `cloudflared --no-autoupdate`; pick the mode via a single command instead:
    #   - token set   -> set CLOUDFLARED_COMMAND="tunnel run" in .env for a named
    #     tunnel (cloudflared reads TUNNEL_TOKEN from the env above).
    #   - token unset -> the default below runs a quick tunnel with an ephemeral
    #     *.trycloudflare.com URL the API discovers from the metrics endpoint.
    command: ${CLOUDFLARED_COMMAND:-tunnel --url http://api:8000 --metrics 0.0.0.0:2000}
    ports:
      - "2000:2000" # metrics endpoint (quick-tunnel URL discovery)
    networks:
      - app-network

  # ==============================================================================
  # Ultra-Lightweight Self-Hosted CPU Local AI Engine (Optional / Admin Opt-In)
  # ==============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: kodewaves_ollama
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-2}
      - LLAMA_ARG_SWA_FULL=${OLLAMA_SWA_FULL:-0}
      - LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT=${OLLAMA_CHECKPOINT_MIN_SPACING_NT:-64}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-3.0}"
          memory: 4096M
        reservations:
          memory: 2048M
    networks:
      - app-network
      # In aaPanel deployments, the API is created from the separate
      # docker-compose.aapanel.yaml project/network. Join that same shared
      # network so the API can resolve the local Ollama service.
      - kodewaves-shared

  ollama-warmup:
    image: python:3.13-alpine
    restart: unless-stopped
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_ENDPOINT: http://ollama:11434
      OLLAMA_WARM_MODELS: "${OLLAMA_WARM_MODELS:-qwen3.5:2b-q4_K_M}"
      OLLAMA_WARM_INTERVAL_SECONDS: "${OLLAMA_WARM_INTERVAL_SECONDS:-30}"
    command: ["python", "/app/warm_local_ollama.py"]
    volumes:
      - ./scripts/warm_local_ollama.py:/app/warm_local_ollama.py:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks:
      - app-network

  # IndicConformer regional decoders and English Moonshine on CPU.
  indic-stt:
    build:
      context: ./api/local_models/indic_stt
    image: kodewaves-indic-stt:v1.0.0
    container_name: kodewaves_indic_stt
    restart: unless-stopped
    profiles: ["local"]
    environment:
      INDIC_STT_LANGUAGES: "${INDIC_STT_LANGUAGES:-all}"
      INDIC_STT_PREWARM_LANGUAGES: "${INDIC_STT_PREWARM_LANGUAGES:-}"
      INDIC_STT_THREADS: "${INDIC_STT_THREADS:-2}"
      INDIC_STT_AUTO_DETECT: "${INDIC_STT_AUTO_DETECT:-1}"
      INDIC_STT_LID_THREADS: "${INDIC_STT_LID_THREADS:-2}"
      INDIC_STT_RESIDENT_MODELS: "${INDIC_STT_RESIDENT_MODELS:-4}"
    volumes:
      - indic_stt_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - app-network

  # Optional bilingual Inaya backend behind the combined speech endpoint.
  indus-tts:
    build:
      context: ./api/local_models/indus_tts
    image: kodewaves-indus-tts:v1.0.0
    container_name: kodewaves_indus_tts
    restart: unless-stopped
    profiles: ["indus"]
    environment:
      INDUS_MODEL_DIR: /models/indus-pocket-tts
      HF_HOME: /models/huggingface
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - indus_tts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    networks:
      - app-network

  # Small regional CPU voice model: 13 documented languages and 20 speakers.
  indic-vits-tts:
    build:
      context: ./api/local_models/indic_vits
    image: kodewaves-indic-vits-tts:v1.0.0
    container_name: kodewaves_indic_vits_tts
    restart: unless-stopped
    profiles: ["local"]
    environment:
      INDIC_VITS_THREADS: "${INDIC_VITS_THREADS:-2}"
      INDUS_TTS_ENDPOINT: "${INDUS_COMBINED_ENDPOINT:-}"
      HF_HOME: /models/huggingface
    volumes:
      - indic_vits_tts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "${INDIC_VITS_CPU_LIMIT:-2.0}"
          memory: "${INDIC_VITS_MEMORY_LIMIT:-1536M}"
    networks:
      - app-network

  dhvaani-tts:
    build:
      context: ./api/local_models/dhvaani
    image: kodewaves-dhvaani-tts:v0.5.0
    container_name: kodewaves_dhvaani_tts
    restart: unless-stopped
    profiles: ["dhvaani"]
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      DHVAANI_THREADS: "${DHVAANI_THREADS:-2}"
      DHVAANI_NUM_STEPS: "${DHVAANI_NUM_STEPS:-16}"
      DHVAANI_MODEL_REVISION: "${DHVAANI_MODEL_REVISION:-main}"
      HF_HOME: /models/huggingface
    volumes:
      - dhvaani_tts_models:/models
      - ./api/local_models/dhvaani/voices:/voices:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "${DHVAANI_CPU_LIMIT:-2.0}"
          memory: 3072M
    networks:
      - app-network

  # Evaluation profile: provision approved weights and tokenizer before starting.
  indic-parler-tts:
    build:
      context: ./api/local_models/indic_parler
      dockerfile: Dockerfile
    image: kodewaves-indic-parler-tts:v1.0.0
    container_name: kodewaves_indic_parler_tts
    restart: "no"
    profiles: ["indic-parler"]
    environment:
      INDIC_PARLER_THREADS: "2"
    volumes:
      - ${INDIC_PARLER_MODELS_DIR:-./models/indic-parler}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    networks:
      - app-network

  # All-Indian-language CPU TTS candidate. Current LiteRT output is buffered
  # per utterance, so keep it selectable separately from the streaming default.
  indic-mio-tts:
    build:
      context: ./api/local_models/indic_mio
      dockerfile: Dockerfile
    image: kodewaves-indic-mio-tts:v1.0.0
    container_name: kodewaves_indic_mio_tts
    restart: "no"
    profiles: ["indic-mio"]
    environment:
      HF_HOME: /models/huggingface
      INDIC_MIO_MODEL_DIR: /models/indic-mio
      OMP_NUM_THREADS: "2"
      TFLITE_NUM_THREADS: "2"
    volumes:
      - indic_mio_tts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 12288M
        reservations:
          memory: 2048M
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio-data:
    driver: local
  nginx-generated:
    driver: local
  coturn-generated:
    driver: local
  ollama_data:
    driver: local
  indic_stt_models:
    driver: local
  indic_mio_tts_models:
    driver: local
  indic_vits_tts_models:
  indus_tts_models:
  dhvaani_tts_models:
    driver: local

networks:
  app-network:
    driver: bridge
  kodewaves-shared:
    external: ${KODEWAVES_SHARED_NETWORK_EXTERNAL:-false}
    name: ${KODEWAVES_NETWORK_NAME:-kodewaves-network}

