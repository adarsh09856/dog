name: Signed client production release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Type RELEASE to authorize a customer client release
        required: true
        type: string
      release_version:
        description: Canonical client version (X.Y.Z); workflow creates a draft tag kodewaves-client-vX.Y.Z
        required: true
        type: string
      min_current_version:
        description: Minimum installed client version eligible for this update (canonical X.Y.Z)
        required: true
        type: string
      release_notes:
        description: Customer-facing update notes (maximum 4000 characters)
        required: true
        type: string
      prior_commit:
        description: Full Git SHA of the prior client release; it must be an ancestor of main
        required: true
        type: string
      api_tag:
        description: New client API release tag; the tag must not already exist
        required: true
        type: string
      ui_tag:
        description: New client UI release tag; the tag must not already exist
        required: true
        type: string
      caddy_image:
        description: Approved Caddy image pinned by sha256 digest
        required: true
        type: string
      postgres_image:
        description: Approved PostgreSQL image pinned by sha256 digest
        required: true
        type: string
      redis_image:
        description: Approved Redis image pinned by sha256 digest
        required: true
        type: string
      minio_image:
        description: Approved PGSTY Silo image pinned to its verified sha256 digest
        required: true
        type: string
      coturn_image:
        description: Approved Coturn image pinned by sha256 digest
        required: true
        type: string
      ollama_image:
        description: Optional Ollama image pinned by sha256 digest; provide the complete four-image inference profile to enable self-hosted speech/LLM
        required: false
        default: ""
        type: string
      indic_stt_image:
        description: Optional Indic STT image pinned by sha256 digest
        required: false
        default: ""
        type: string
      indus_tts_image:
        description: Optional Indus TTS image pinned by sha256 digest
        required: false
        default: ""
        type: string
      indic_vits_tts_image:
        description: Optional Indic VITS TTS image pinned by sha256 digest
        required: false
        default: ""
        type: string
      ollama_model_name:
        description: Required for the self-hosted inference profile; exact Ollama model identifier
        required: false
        default: ""
        type: string
      ollama_model_digest:
        description: Required for the self-hosted inference profile; sha256 digest of the Ollama model weights
        required: false
        default: ""
        type: string
      owner_status_url:
        description: HTTPS owner installation-status endpoint for released clients
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: client-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    environment: client-production
    # GitHub-hosted VMs are discarded after each job. Keep the protected
    # environment/reviewer gate and expose release secrets only to this job;
    # a persistent self-hosted signing runner is not required.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require explicit release confirmation and trusted main ref
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_RELEASE" = "RELEASE"
          command -v docker >/dev/null
          docker buildx version

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Keep the prior checkout outside the candidate's signed source tree.
          path: release-source
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prior_commit }}
          fetch-depth: 1
          path: prior-source
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release version and ensure the draft tag is unused
        id: release_metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          MIN_CURRENT_VERSION: ${{ inputs.min_current_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          version_re = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          version = os.environ["RELEASE_VERSION"]
          minimum = os.environ["MIN_CURRENT_VERSION"]
          notes = os.environ["RELEASE_NOTES"]
          version_match = version_re.fullmatch(version)
          minimum_match = version_re.fullmatch(minimum)
          if not version_match or not minimum_match:
              raise SystemExit("Release versions must use canonical X.Y.Z format")
          version_parts = tuple(map(int, version_match.groups()))
          minimum_parts = tuple(map(int, minimum_match.groups()))
          if max(*version_parts, *minimum_parts) > 2**31 - 1:
              raise SystemExit("Release version component is too large")
          if minimum_parts > version_parts:
              raise SystemExit("Minimum current version cannot exceed release version")
          if len(notes) > 4000 or "\x00" in notes:
              raise SystemExit("Release notes must be at most 4000 characters")

          repository = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("GitHub repository identity is invalid")
          tag = f"kodewaves-client-v{version}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/ref/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15):
                  raise SystemExit(f"Release tag already exists: {tag}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise SystemExit(f"Could not verify release tag availability (HTTP {exc.code})") from exc
          except urllib.error.URLError as exc:
              raise SystemExit("Could not verify release tag availability") from exc
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          PY

      - name: Install isolated lifecycle tooling
        run: python -m pip install --disable-pip-version-check cryptography 'sqlalchemy==2.0.43' 'PyYAML==6.0.2'

      - name: Test the prior schema against this candidate release
        id: lifecycle_acceptance
        shell: bash
        working-directory: release-source
        env:
          PRIOR_COMMIT: ${{ inputs.prior_commit }}
          COTURN_IMAGE: ${{ inputs.coturn_image }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          MINIO_IMAGE: ${{ inputs.minio_image }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          LIFECYCLE_REPORT: ${{ runner.temp }}/client-production-lifecycle-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          python deploy/client/lifecycle_acceptance.py \
            --prior-commit "$PRIOR_COMMIT" \
            --prior-source "$GITHUB_WORKSPACE/prior-source" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --coturn-image "$COTURN_IMAGE" \
            --caddy-image "$CADDY_IMAGE" \
            --minio-image "$MINIO_IMAGE" \
            --report "$LIFECYCLE_REPORT"
          python deploy/client/production_release_preflight.py \
            --report "$LIFECYCLE_REPORT" \
            --prior-commit "$PRIOR_COMMIT" \
            --candidate-commit "$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Lifecycle rollback acceptance passed for prior schema $(grep '^prior_schema_head=' "$GITHUB_OUTPUT" | cut -d= -f2)."

      - name: Preserve sanitized production lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-production-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/client-production-lifecycle-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate release inputs
        shell: bash
        env:
          REGISTRY_HOST: ghcr.io
          API_TAG: ${{ inputs.api_tag }}
          UI_TAG: ${{ inputs.ui_tag }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          REDIS_IMAGE: ${{ inputs.redis_image }}
          MINIO_IMAGE: ${{ inputs.minio_image }}
          COTURN_IMAGE: ${{ inputs.coturn_image }}
          OLLAMA_IMAGE: ${{ inputs.ollama_image }}
          INDIC_STT_IMAGE: ${{ inputs.indic_stt_image }}
          INDUS_TTS_IMAGE: ${{ inputs.indus_tts_image }}
          INDIC_VITS_TTS_IMAGE: ${{ inputs.indic_vits_tts_image }}
          OLLAMA_MODEL_NAME: ${{ inputs.ollama_model_name }}
          OLLAMA_MODEL_DIGEST: ${{ inputs.ollama_model_digest }}
          OWNER_STATUS_URL: ${{ inputs.owner_status_url }}
        run: |
          set -euo pipefail
          for value in "$REGISTRY_HOST" "$API_TAG" "$UI_TAG" "$CADDY_IMAGE" \
            "$POSTGRES_IMAGE" "$REDIS_IMAGE" "$MINIO_IMAGE" "$COTURN_IMAGE" "$OWNER_STATUS_URL"; do
            test -n "$value"
          done
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          registry = os.environ["REGISTRY_HOST"]
          if not re.fullmatch(r"[a-z0-9.-]+(?::[0-9]{1,5})?", registry):
              raise SystemExit("registry_host must be a hostname with an optional port")
          owner = os.environ["GITHUB_REPOSITORY"].split("/", 1)[0].lower()
          image_paths = {
              "API_TAG": f"{registry}/{owner}/kodewaves-api:",
              "UI_TAG": f"{registry}/{owner}/kodewaves-ui:",
          }
          for name, expected_prefix in image_paths.items():
              ref = os.environ[name]
              if not ref.startswith(expected_prefix) or ref.count("/") != 2:
                  raise SystemExit(f"{name} must use the repository's approved GHCR image path")
              tag = ref[len(expected_prefix):]
              if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag):
                  raise SystemExit(f"{name} must include a valid, new release tag")
          for name in ("CADDY_IMAGE", "POSTGRES_IMAGE", "REDIS_IMAGE", "MINIO_IMAGE", "COTURN_IMAGE"):
              if not re.fullmatch(
                  r"[a-z0-9][a-z0-9.-]*(?::[0-9]{1,5})?"
                  r"(?:/[a-z0-9]+(?:[._-][a-z0-9]+)*)+@sha256:[0-9a-f]{64}",
                  os.environ[name],
              ):
                  raise SystemExit(f"{name} must be an immutable sha256 image reference")
          model_images = {
              "OLLAMA_IMAGE": os.environ["OLLAMA_IMAGE"],
              "INDIC_STT_IMAGE": os.environ["INDIC_STT_IMAGE"],
              "INDUS_TTS_IMAGE": os.environ["INDUS_TTS_IMAGE"],
              "INDIC_VITS_TTS_IMAGE": os.environ["INDIC_VITS_TTS_IMAGE"],
          }
          model_values = [value.strip() for value in model_images.values()]
          model_name = os.environ["OLLAMA_MODEL_NAME"].strip()
          model_digest = os.environ["OLLAMA_MODEL_DIGEST"].strip()
          if any(model_values):
              if not all(model_values):
                  raise SystemExit("Self-hosted inference requires all four model image digests")
              if not model_name or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}", model_name):
                  raise SystemExit("OLLAMA_MODEL_NAME must identify the pinned Ollama model")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", model_digest):
                  raise SystemExit("OLLAMA_MODEL_DIGEST must be a sha256 model-weights digest")
              for name, value in model_images.items():
                  if not re.fullmatch(
                      r"[a-z0-9][a-z0-9.-]*(?::[0-9]{1,5})?"
                      r"(?:/[a-z0-9]+(?:[._-][a-z0-9]+)*)+@sha256:[0-9a-f]{64}",
                      value,
                  ):
                      raise SystemExit(f"{name} must be an immutable sha256 image reference")
          elif model_name or model_digest:
              raise SystemExit("Ollama model name and digest require the complete four-image inference profile")
          if os.environ["MINIO_IMAGE"] != "docker.io/pgsty/silo@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7":
              raise SystemExit("MINIO_IMAGE must use the approved PGSTY Silo release and immutable digest")
          owner = urlsplit(os.environ["OWNER_STATUS_URL"])
          if owner.scheme != "https" or not owner.hostname or owner.username or owner.password or owner.fragment:
              raise SystemExit("owner_status_url must be an HTTPS URL without credentials or fragment")
          PY

      - name: Require protected release secrets
        shell: bash
        env:
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.CLIENT_LICENSE_PUBLIC_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.CLIENT_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.CLIENT_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          for value in "$LICENSE_PUBLIC_KEY_B64" "$RELEASE_PUBLIC_KEY_B64" \
            "$RELEASE_PRIVATE_KEY_B64"; do
            test -n "$value"
            case "$value" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          done

      - name: Prepare ephemeral release signing keys
        shell: bash
        env:
          DOCKER_CONFIG: /dev/shm/kodewaves-client-docker-${{ github.run_id }}-${{ github.run_attempt }}
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.CLIENT_LICENSE_PUBLIC_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.CLIENT_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.CLIENT_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          key_dir="/dev/shm/kodewaves-client-release-keys-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$key_dir"
          umask 077
          printf '%s\n' "$LICENSE_PUBLIC_KEY_B64" > "$key_dir/license-public.key"
          printf '%s\n' "$RELEASE_PUBLIC_KEY_B64" > "$key_dir/release-public.key"
          printf '%s\n' "$RELEASE_PRIVATE_KEY_B64" > "$key_dir/release-private.key"
          mkdir -m 0700 "$DOCKER_CONFIG"

      - name: Log in to the release registry
        uses: docker/login-action@v3
        env:
          DOCKER_CONFIG: /dev/shm/kodewaves-client-docker-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Verify self-hosted image digests exist in registries
        shell: bash
        env:
          DOCKER_CONFIG: /dev/shm/kodewaves-client-docker-${{ github.run_id }}-${{ github.run_attempt }}
          OLLAMA_IMAGE: ${{ inputs.ollama_image }}
          INDIC_STT_IMAGE: ${{ inputs.indic_stt_image }}
          INDUS_TTS_IMAGE: ${{ inputs.indus_tts_image }}
          INDIC_VITS_TTS_IMAGE: ${{ inputs.indic_vits_tts_image }}
        run: |
          set -euo pipefail
          # Cloud-only installs intentionally omit this optional profile.
          if [[ -z "$OLLAMA_IMAGE" ]]; then
            exit 0
          fi
          for image in "$OLLAMA_IMAGE" "$INDIC_STT_IMAGE" "$INDUS_TTS_IMAGE" "$INDIC_VITS_TTS_IMAGE"; do
            docker buildx imagetools inspect "$image" >/dev/null
          done

      - name: Build, verify, sign and package the client release
        shell: bash
        working-directory: release-source
        env:
          API_TAG: ${{ inputs.api_tag }}
          UI_TAG: ${{ inputs.ui_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          MIN_CURRENT_VERSION: ${{ inputs.min_current_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          OWNER_STATUS_URL: ${{ inputs.owner_status_url }}
          PRIOR_SCHEMA_HEAD: ${{ steps.lifecycle_acceptance.outputs.prior_schema_head }}
          CLIENT_POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          CLIENT_REDIS_IMAGE: ${{ inputs.redis_image }}
          CLIENT_MINIO_IMAGE: ${{ inputs.minio_image }}
          CLIENT_COTURN_IMAGE: ${{ inputs.coturn_image }}
          CLIENT_CADDY_IMAGE: ${{ inputs.caddy_image }}
          CLIENT_OLLAMA_IMAGE: ${{ inputs.ollama_image }}
          CLIENT_INDIC_STT_IMAGE: ${{ inputs.indic_stt_image }}
          CLIENT_INDUS_TTS_IMAGE: ${{ inputs.indus_tts_image }}
          CLIENT_INDIC_VITS_TTS_IMAGE: ${{ inputs.indic_vits_tts_image }}
          CLIENT_OLLAMA_MODEL: ${{ inputs.ollama_model_name }}
          CLIENT_OLLAMA_MODEL_DIGEST: ${{ inputs.ollama_model_digest }}
          CLIENT_RELEASE_WORK_DIR: ${{ runner.temp }}/client-release-${{ github.run_id }}-${{ github.run_attempt }}
          CLIENT_RELEASE_KEY_DIR: /dev/shm/kodewaves-client-release-keys-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_CONFIG: /dev/shm/kodewaves-client-docker-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          : "${PRIOR_SCHEMA_HEAD:?Missing prior schema head from lifecycle acceptance}"
          work_dir="$CLIENT_RELEASE_WORK_DIR"
          key_dir="$CLIENT_RELEASE_KEY_DIR"
          mkdir -m 0700 "$work_dir"
          trap 'rm -rf "$work_dir" "$key_dir" "$DOCKER_CONFIG"' EXIT
          python -m pip install --disable-pip-version-check cryptography 'sqlalchemy==2.0.43' 'PyYAML==6.0.2'
          model_args=()
          if [[ -n "$CLIENT_OLLAMA_IMAGE" ]]; then
            CLIENT_RELEASE_WORK_DIR="$work_dir" python - <<'PY'
          import json
          import os
          from pathlib import Path

          work_dir = Path(os.environ["CLIENT_RELEASE_WORK_DIR"])
          model_images = {
              "ollama": os.environ["CLIENT_OLLAMA_IMAGE"],
              "indic_stt": os.environ["CLIENT_INDIC_STT_IMAGE"],
              "indus_tts": os.environ["CLIENT_INDUS_TTS_IMAGE"],
              "indic_vits_tts": os.environ["CLIENT_INDIC_VITS_TTS_IMAGE"],
          }
          model_assets = {
              "ollama": {
                  "name": os.environ["CLIENT_OLLAMA_MODEL"],
                  "digest": os.environ["CLIENT_OLLAMA_MODEL_DIGEST"],
              }
          }
          (work_dir / "model-images.json").write_text(json.dumps(model_images), encoding="utf-8")
          (work_dir / "model-assets.json").write_text(json.dumps(model_assets), encoding="utf-8")
          PY
            model_args+=(--model-images-json "$work_dir/model-images.json" --model-assets-json "$work_dir/model-assets.json")
          fi
          python deploy/client/build_and_verify.py \
            --source-commit "$GITHUB_SHA" \
            --api-tag "$API_TAG" \
            --ui-tag "$UI_TAG" \
            --caddy-image "$CADDY_IMAGE" \
            --license-public-key-file "$key_dir/license-public.key" \
            --release-public-key-file "$key_dir/release-public.key" \
            --owner-status-url "$OWNER_STATUS_URL" \
            --owner-private-key "$key_dir/release-private.key" \
            --approved-upgrade-from "$PRIOR_SCHEMA_HEAD" \
            --approved-rollback-to "$PRIOR_SCHEMA_HEAD" \
            --manifest-output "$work_dir/client-release-manifest.json" \
            --public-key-output "$work_dir/release-public.key.out" \
            "${model_args[@]}" \
            --push \
            --release-env-output "$work_dir/release-images.env"
          cmp "$key_dir/release-public.key" "$work_dir/release-public.key.out"

          CLIENT_RELEASE_WORK_DIR="$work_dir" python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "deploy" / "client"))
          from validate_install import parse_env, validate_release_image_inventory

          work_dir = Path(os.environ["CLIENT_RELEASE_WORK_DIR"])
          images = parse_env(work_dir / "release-images.env")
          inputs = {
              "CLIENT_POSTGRES_IMAGE": os.environ["CLIENT_POSTGRES_IMAGE"],
              "CLIENT_REDIS_IMAGE": os.environ["CLIENT_REDIS_IMAGE"],
              "CLIENT_MINIO_IMAGE": os.environ["CLIENT_MINIO_IMAGE"],
              "CLIENT_COTURN_IMAGE": os.environ["CLIENT_COTURN_IMAGE"],
              "CLIENT_CADDY_IMAGE": os.environ["CLIENT_CADDY_IMAGE"],
          }
          model_images = {
              "CLIENT_OLLAMA_IMAGE": os.environ["CLIENT_OLLAMA_IMAGE"],
              "CLIENT_INDIC_STT_IMAGE": os.environ["CLIENT_INDIC_STT_IMAGE"],
              "CLIENT_INDUS_TTS_IMAGE": os.environ["CLIENT_INDUS_TTS_IMAGE"],
              "CLIENT_INDIC_VITS_TTS_IMAGE": os.environ["CLIENT_INDIC_VITS_TTS_IMAGE"],
          }
          if any(value.strip() for value in model_images.values()):
              if not all(value.strip() for value in model_images.values()):
                  raise SystemExit("Self-hosted inference requires all four model image digests")
              inputs.update(model_images)
              inputs["CLIENT_OLLAMA_MODEL"] = os.environ["CLIENT_OLLAMA_MODEL"]
              inputs["CLIENT_OLLAMA_MODEL_DIGEST"] = os.environ["CLIENT_OLLAMA_MODEL_DIGEST"]
          if set(images) != {"CLIENT_API_IMAGE", "CLIENT_UI_IMAGE"}:
              raise SystemExit("image builder did not return exactly the signed API/UI images")
          images.update(inputs)
          validate_release_image_inventory(images)
          (work_dir / "customer-images.env").write_text(
              "".join(f"{name}={images[name]}\n" for name in sorted(images)),
              encoding="utf-8",
          )
          PY

          python owner-tools/fetch_client_silo_source.py \
            --output "$work_dir/silo-source-RELEASE.2026-10-26T00-00-00Z.tar.gz"
          python owner-tools/package_client_installer.py \
            --images-env "$work_dir/customer-images.env" \
            --manifest "$work_dir/client-release-manifest.json" \
            --release-public-key "$key_dir/release-public.key" \
            --release-private-key "$key_dir/release-private.key" \
            --silo-source-archive "$work_dir/silo-source-RELEASE.2026-10-26T00-00-00Z.tar.gz" \
            --output "$work_dir/kodewaves-client-installer.tar.gz"
          python deploy/client/verify_installer.py \
            --archive "$work_dir/kodewaves-client-installer.tar.gz" \
            --signature "$work_dir/kodewaves-client-installer.tar.gz.sig" \
            --trusted-public-key "$key_dir/release-public.key"
          archive_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/kodewaves-client-installer.tar.gz"
          python owner-tools/sign_client_update_release.py \
            --archive "$work_dir/kodewaves-client-installer.tar.gz" \
            --release-id "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --archive-url "$archive_url" \
            --min-current-version "$MIN_CURRENT_VERSION" \
            --notes "$RELEASE_NOTES" \
            --release-private-key "$key_dir/release-private.key" \
            --trusted-public-key "$key_dir/release-public.key" \
            --output "$work_dir/kodewaves-client-update.json"
          artifact_dir="$RUNNER_TEMP/client-release-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$artifact_dir"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/source-commit.txt"
          cp "$work_dir/client-release-manifest.json" "$artifact_dir/"
          cp "$key_dir/release-public.key" "$artifact_dir/"
          cp "$work_dir/customer-images.env" "$artifact_dir/"
          cp "$work_dir/kodewaves-client-installer.tar.gz" "$artifact_dir/"
          cp "$work_dir/kodewaves-client-installer.tar.gz.sig" "$artifact_dir/"
          cp "$work_dir/kodewaves-client-update.json" "$artifact_dir/"

      - name: Publish signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodewaves-client-release-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/client-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release with customer update assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/client-release-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for asset in \
            kodewaves-client-installer.tar.gz \
            kodewaves-client-installer.tar.gz.sig \
            kodewaves-client-update.json \
            client-release-manifest.json \
            release-public.key; do
            test -s "$artifact_dir/$asset"
          done
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          gh release create --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Kodewaves Client $RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            "$artifact_dir/kodewaves-client-installer.tar.gz" \
            "$artifact_dir/kodewaves-client-installer.tar.gz.sig" \
            "$artifact_dir/kodewaves-client-update.json" \
            "$artifact_dir/client-release-manifest.json" \
            "$artifact_dir/release-public.key"
          {
            echo "### Draft client release prepared"
            echo
            echo "Draft: $release_url"
            echo
            echo "The installer, detached signature, signed update envelope, manifest, and trusted public key are attached. Review the source SHA, image digests, archive signature, and update envelope, then publish this draft to make the stable update URL downloadable. The release remains a draft until an owner explicitly publishes it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release material from the runner
        if: always()
        shell: bash
        run: |
          rm -rf \
            "/dev/shm/kodewaves-client-release-keys-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "/dev/shm/kodewaves-client-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/client-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/client-release-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
