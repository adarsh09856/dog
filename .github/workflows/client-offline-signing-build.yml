name: Client offline-signing image build

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit on main to build and stage
        required: true
        type: string
      license_public_key:
        description: Canonical URL-safe Base64 Ed25519 license public key (43 characters)
        required: true
        type: string
      release_public_key:
        description: Canonical URL-safe Base64 Ed25519 release public key (43 characters)
        required: true
        type: string
      owner_status_url:
        description: HTTPS URL ending exactly in /api/v1/admin/client-installations/check
        required: true
        type: string
      caddy_image:
        description: Approved immutable Caddy image, pinned with @sha256 digest
        required: true
        type: string
      postgres_image:
        description: Official pgvector PostgreSQL image, immutable digest
        required: true
        type: string
      redis_image:
        description: Official Redis image, immutable digest
        required: true
        type: string
      minio_image:
        description: Official MinIO image, immutable digest
        required: true
        type: string
      coturn_image:
        description: Official Coturn image, immutable digest
        required: true
        type: string
      ollama_image:
        description: Official Ollama image, immutable digest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: client-offline-signing-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout workflow policy from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact source and public inputs
        id: inputs
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          LICENSE_PUBLIC_KEY: ${{ inputs.license_public_key }}
          RELEASE_PUBLIC_KEY: ${{ inputs.release_public_key }}
          OWNER_STATUS_URL: ${{ inputs.owner_status_url }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          REDIS_IMAGE: ${{ inputs.redis_image }}
          MINIO_IMAGE: ${{ inputs.minio_image }}
          COTURN_IMAGE: ${{ inputs.coturn_image }}
          OLLAMA_IMAGE: ${{ inputs.ollama_image }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64
          import os
          import re
          from urllib.parse import urlsplit

          source = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source_commit must be a lowercase 40-character Git SHA")
          for name in ("LICENSE_PUBLIC_KEY", "RELEASE_PUBLIC_KEY"):
              encoded = os.environ[name]
              if not re.fullmatch(r"[A-Za-z0-9_-]{43}", encoded):
                  raise SystemExit(f"{name.lower()} must be canonical 43-character URL-safe Base64")
              decoded = base64.urlsafe_b64decode(encoded + "=")
              if len(decoded) != 32 or base64.urlsafe_b64encode(decoded).rstrip(b"=").decode("ascii") != encoded:
                  raise SystemExit(f"{name.lower()} is not a canonical Ed25519 public key")
          endpoint = urlsplit(os.environ["OWNER_STATUS_URL"])
          if (
              endpoint.scheme != "https"
              or not endpoint.hostname
              or endpoint.username
              or endpoint.password
              or endpoint.query
              or endpoint.fragment
              or endpoint.path != "/api/v1/admin/client-installations/check"
              or any(ord(char) < 33 or char in {'"', "\\"} for char in os.environ["OWNER_STATUS_URL"])
          ):
              raise SystemExit("owner_status_url must be HTTPS with the fixed installation-check path and no credentials/query/fragment")
          if not re.fullmatch(
              r"(?:caddy|docker\.io/library/caddy)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
              os.environ["CADDY_IMAGE"],
          ):
              raise SystemExit("caddy_image must be an immutable official Caddy image reference")
          approved_images = {
              "POSTGRES_IMAGE": r"(?:pgvector/pgvector|docker\.io/pgvector/pgvector)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
              "REDIS_IMAGE": r"(?:redis|docker\.io/library/redis)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
              "MINIO_IMAGE": r"(?:minio/minio|docker\.io/minio/minio)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
              "COTURN_IMAGE": r"(?:coturn/coturn|docker\.io/coturn/coturn)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
              "OLLAMA_IMAGE": r"(?:ollama/ollama|docker\.io/ollama/ollama)(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}",
          }
          for name, pattern in approved_images.items():
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit(f"{name.lower()} must use its approved official repository and immutable sha256 digest")
          PY
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "api_tag=ghcr.io/adarsh09856/kodewaves-api:client-stage-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "ui_tag=ghcr.io/adarsh09856/kodewaves-ui:client-stage-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "model_prefix=ghcr.io/adarsh09856/kodewaves-api:client-model-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "postgres_image=$POSTGRES_IMAGE" >> "$GITHUB_OUTPUT"
          echo "redis_image=$REDIS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "minio_image=$MINIO_IMAGE" >> "$GITHUB_OUTPUT"
          echo "coturn_image=$COTURN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ollama_image=$OLLAMA_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ollama_model=qwen3.5:2b-q4_K_M" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive
          path: release-source
          persist-credentials: false

      - name: Install release verification tooling
        run: python -m pip install --disable-pip-version-check cryptography 'sqlalchemy==2.0.43' 'PyYAML==6.0.2'

      - name: Build and verify client images without signing
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          API_TAG: ${{ steps.inputs.outputs.api_tag }}
          UI_TAG: ${{ steps.inputs.outputs.ui_tag }}
          LICENSE_PUBLIC_KEY: ${{ inputs.license_public_key }}
          RELEASE_PUBLIC_KEY: ${{ inputs.release_public_key }}
          OWNER_STATUS_URL: ${{ inputs.owner_status_url }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          ARTIFACT_DIR: ${{ runner.temp }}/client-offline-signing-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-source"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -m 0700 -p "$ARTIFACT_DIR"
          printf '%s\n' "$LICENSE_PUBLIC_KEY" > "$ARTIFACT_DIR/license-public.key"
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$ARTIFACT_DIR/release-public.key"
          python deploy/client/build_and_verify.py \
            --source-commit "$SOURCE_COMMIT" \
            --api-tag "$API_TAG" \
            --ui-tag "$UI_TAG" \
            --caddy-image "$CADDY_IMAGE" \
            --license-public-key-file "$ARTIFACT_DIR/license-public.key" \
            --release-public-key-file "$ARTIFACT_DIR/release-public.key" \
            --owner-status-url "$OWNER_STATUS_URL"
          printf '%s\n' "$SOURCE_COMMIT" > "$ARTIFACT_DIR/source-commit.txt"
          printf '%s\n' "$OWNER_STATUS_URL" > "$ARTIFACT_DIR/owner-status-url.txt"
          printf '%s\n' "$CADDY_IMAGE" > "$ARTIFACT_DIR/caddy-image.txt"

      - name: Build pinned Ollama, Indic STT and local TTS images
        id: models
        shell: bash
        env:
          MODEL_PREFIX: ${{ steps.inputs.outputs.model_prefix }}
          OLLAMA_IMAGE: ${{ steps.inputs.outputs.ollama_image }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-source"
          ollama_tag="${MODEL_PREFIX}-ollama"
          stt_tag="${MODEL_PREFIX}-indic-stt"
          indus_tag="${MODEL_PREFIX}-indus-tts"
          vits_tag="${MODEL_PREFIX}-indic-vits-tts"
          docker pull "$OLLAMA_IMAGE"
          docker tag "$OLLAMA_IMAGE" "$ollama_tag"
          docker build -f api/local_models/indic_stt/Dockerfile -t "$stt_tag" api/local_models/indic_stt
          docker build -f api/local_models/indus_tts/Dockerfile -t "$indus_tag" api/local_models/indus_tts
          docker build -f api/local_models/indic_vits/Dockerfile -t "$vits_tag" api/local_models/indic_vits
          {
            echo "ollama_tag=$ollama_tag"
            echo "stt_tag=$stt_tag"
            echo "indus_tag=$indus_tag"
            echo "vits_tag=$vits_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact Ollama model-weight digest
        shell: bash
        env:
          OLLAMA_IMAGE: ${{ steps.inputs.outputs.ollama_image }}
          OLLAMA_MODEL: ${{ steps.inputs.outputs.ollama_model }}
          ARTIFACT_DIR: ${{ runner.temp }}/client-offline-signing-${{ github.run_id }}-${{ github.run_attempt }}
          CONTAINER_NAME: client-model-digest-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:11434:11434 \
            --env OLLAMA_HOST=0.0.0.0:11434 \
            "$OLLAMA_IMAGE" >/dev/null
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = "http://127.0.0.1:11434"
          name = os.environ["OLLAMA_MODEL"]
          def request(path, payload=None, timeout=30):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(base + path, data=body, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read())

          deadline = time.monotonic() + 180
          while True:
              try:
                  request("/api/tags")
                  break
              except (OSError, urllib.error.URLError, json.JSONDecodeError):
                  if time.monotonic() >= deadline:
                      raise SystemExit("Pinned Ollama server did not become ready")
                  time.sleep(3)

          request("/api/pull", {"model": name, "stream": False}, timeout=7200)
          tags = request("/api/tags", timeout=60)
          models = tags.get("models") if isinstance(tags, dict) else None
          matches = [item for item in models or [] if isinstance(item, dict) and item.get("name") == name]
          if len(matches) != 1:
              raise SystemExit("Ollama did not return exactly one digest for the approved model name")
          raw_digest = matches[0].get("digest")
          if isinstance(raw_digest, str) and raw_digest.startswith("sha256:"):
              raw_digest = raw_digest.removeprefix("sha256:")
          if not isinstance(raw_digest, str) or not re.fullmatch(r"[0-9a-f]{64}", raw_digest):
              raise SystemExit("Ollama returned an invalid model digest")
          assets = {"ollama": {"name": name, "digest": "sha256:" + raw_digest}}
          output = Path(os.environ["ARTIFACT_DIR"]) / "model-assets.json"
          output.write_text(json.dumps(assets, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Push uniquely tagged staging images
        shell: bash
        env:
          API_TAG: ${{ steps.inputs.outputs.api_tag }}
          UI_TAG: ${{ steps.inputs.outputs.ui_tag }}
          OLLAMA_TAG: ${{ steps.models.outputs.ollama_tag }}
          STT_TAG: ${{ steps.models.outputs.stt_tag }}
          INDUS_TAG: ${{ steps.models.outputs.indus_tag }}
          VITS_TAG: ${{ steps.models.outputs.vits_tag }}
        run: |
          set -euo pipefail
          for tag in "$API_TAG" "$UI_TAG" "$OLLAMA_TAG" "$STT_TAG" "$INDUS_TAG" "$VITS_TAG"; do
            docker push "$tag"
          done

      - name: Export actual image inventories and schema metadata
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          API_TAG: ${{ steps.inputs.outputs.api_tag }}
          UI_TAG: ${{ steps.inputs.outputs.ui_tag }}
          OLLAMA_TAG: ${{ steps.models.outputs.ollama_tag }}
          STT_TAG: ${{ steps.models.outputs.stt_tag }}
          INDUS_TAG: ${{ steps.models.outputs.indus_tag }}
          VITS_TAG: ${{ steps.models.outputs.vits_tag }}
          POSTGRES_IMAGE: ${{ steps.inputs.outputs.postgres_image }}
          REDIS_IMAGE: ${{ steps.inputs.outputs.redis_image }}
          MINIO_IMAGE: ${{ steps.inputs.outputs.minio_image }}
          COTURN_IMAGE: ${{ steps.inputs.outputs.coturn_image }}
          CADDY_IMAGE: ${{ inputs.caddy_image }}
          OLLAMA_MODEL: ${{ steps.inputs.outputs.ollama_model }}
          ARTIFACT_DIR: ${{ runner.temp }}/client-offline-signing-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-source"
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "deploy" / "client"))
          from build_and_verify import _pushed_digest
          from api.services.release_schema import migration_compatibility

          out = Path(os.environ["ARTIFACT_DIR"])
          tags = {"api": os.environ["API_TAG"], "ui": os.environ["UI_TAG"]}
          model_tags = {
              "ollama": os.environ["OLLAMA_TAG"],
              "indic_stt": os.environ["STT_TAG"],
              "indus_tts": os.environ["INDUS_TAG"],
              "indic_vits_tts": os.environ["VITS_TAG"],
          }
          images = {}
          for component, tag in tags.items():
              repo_digests = subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", tag],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()
              reference = _pushed_digest(tag, repo_digests)
              if not reference.startswith(tag.rsplit(":", 1)[0] + "@sha256:"):
                  raise SystemExit(f"{component} digest is not bound to its approved GHCR repository")
              images[component] = {"kind": "registry_digest", "reference": reference}

          model_images = {}
          for component, tag in model_tags.items():
              repo_digests = subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", tag],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()
              reference = _pushed_digest(tag, repo_digests)
              if not reference.startswith(tag.rsplit(":", 1)[0] + "@sha256:"):
                  raise SystemExit(f"{component} digest is not bound to its approved GHCR repository")
              model_images[component] = reference
          model_assets = json.loads((out / "model-assets.json").read_text(encoding="utf-8"))
          if (
              not isinstance(model_assets, dict)
              or set(model_assets) != {"ollama"}
              or not isinstance(model_assets["ollama"], dict)
              or set(model_assets["ollama"]) != {"name", "digest"}
              or model_assets["ollama"].get("name") != os.environ["OLLAMA_MODEL"]
              or not isinstance(model_assets["ollama"].get("digest"), str)
              or not re.fullmatch(r"sha256:[0-9a-f]{64}", model_assets["ollama"]["digest"])
          ):
              raise SystemExit("Ollama model assets do not match the staged model name")

          api_inventory = subprocess.run(
              ["docker", "run", "--rm", "--network", "none", "--entrypoint", "python",
               images["api"]["reference"], "-c",
               "import json; from pathlib import Path; from api.services.release_integrity import protected_files; print(json.dumps(protected_files(Path('/app'))))"],
              check=True, capture_output=True, text=True,
          ).stdout
          ui_inventory = subprocess.run(
              ["docker", "run", "--rm", "--network", "none", "--entrypoint", "node",
               images["ui"]["reference"], "/app/verify-client-release.mjs", "--inventory"],
              check=True, capture_output=True, text=True,
          ).stdout
          inventories = {"api-inventory.json": json.loads(api_inventory),
                         "ui-inventory.json": json.loads(ui_inventory)}
          if any(not isinstance(value, dict) or not value for value in inventories.values()):
              raise SystemExit("Protected API/UI inventories must be non-empty JSON objects")
          for name, value in inventories.items():
              (out / name).write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          (out / "images.json").write_text(json.dumps(images, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          (out / "model-images.json").write_text(json.dumps(model_images, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          package_images = {
              "CLIENT_API_IMAGE": images["api"]["reference"],
              "CLIENT_UI_IMAGE": images["ui"]["reference"],
              "CLIENT_POSTGRES_IMAGE": os.environ["POSTGRES_IMAGE"],
              "CLIENT_REDIS_IMAGE": os.environ["REDIS_IMAGE"],
              "CLIENT_MINIO_IMAGE": os.environ["MINIO_IMAGE"],
              "CLIENT_COTURN_IMAGE": os.environ["COTURN_IMAGE"],
              "CLIENT_CADDY_IMAGE": os.environ["CADDY_IMAGE"],
              "CLIENT_OLLAMA_IMAGE": model_images["ollama"],
              "CLIENT_OLLAMA_MODEL": model_assets["ollama"]["name"],
              "CLIENT_OLLAMA_MODEL_DIGEST": model_assets["ollama"]["digest"],
              "CLIENT_INDIC_STT_IMAGE": model_images["indic_stt"],
              "CLIENT_INDUS_TTS_IMAGE": model_images["indus_tts"],
              "CLIENT_INDIC_VITS_TTS_IMAGE": model_images["indic_vits_tts"],
          }
          (out / "customer-images.env").write_text(
              "".join(f"{key}={value}\n" for key, value in package_images.items()), encoding="utf-8"
          )
          schema = migration_compatibility(root / "api" / "alembic" / "versions")
          (out / "schema-compatibility.json").write_text(json.dumps(schema, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          (out / "artifact-README.md").write_text(
              "# Unsigned client image staging bundle\n\n"
              f"Source commit: `{os.environ['SOURCE_COMMIT']}`\n\n"
              "This bundle is not a customer release. The images are public, uniquely tagged staging images; "
              "the artifact contains no owner private key and no signed license. `customer-images.env` pins "
              "all seven infrastructure images and all four local inference images to immutable digests; "
              "`model-assets.json` records the exact Ollama model-weight digest.\n\n"
              "From a trusted owner machine, check out this exact source commit, verify the public keys and "
              "all image and model-weight digests, then sign the API/UI inventories, exact four-component local-model image inventory, "
              "and Ollama model asset inventory with:\n\n"
              "```bash\n"
              "python owner-tools/sign_client_release.py \\\n"
              "  --files-json api-inventory.json \\\n"
              "  --ui-files-json ui-inventory.json \\\n"
              "  --images-json images.json \\\n"
              "  --model-images-json model-images.json \\\n"
              "  --model-assets-json model-assets.json \\\n"
              "  --schema-compatibility-json schema-compatibility.json \\\n"
              "  --private-key /secure/offline/release-private.key \\\n"
              "  --output client-release-manifest.json \\\n"
              "  --public-key-output release-public.key\n"
              "```\n\n"
              "The signer must be run from the checked-out source because it imports the release verifier. "
              "Then assemble and sign the full client package with the same trusted release key:\n\n"
              "```bash\n"
              "python owner-tools/package_client_installer.py \\\n"
              "  --images-env customer-images.env \\\n"
              "  --manifest client-release-manifest.json \\\n"
              "  --release-public-key release-public.key \\\n"
              "  --release-private-key /secure/offline/release-private.key \\\n"
              "  --output customer-installer.tar.gz\n"
              "```\n\n"
              "Run the signed-package lifecycle acceptance before customer distribution.\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unsigned offline-signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: client-offline-signing-${{ steps.inputs.outputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-offline-signing-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
