name: Verify client bundle images

on:
  push:
    branches:
      - codex/client-bundle-verification-*
      - codex/client-bundle-theme
      - codex/kodewaves-shared-work
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      caddy_image:
        description: "Approved Caddy image@sha256 digest for the client ingress"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-bundle-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kodewaves_client_release_test
          POSTGRES_USER: kodewaves_test
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kodewaves_test -d kodewaves_client_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API and test dependencies
        run: |
          python -m pip install -r api/requirements.txt pytest pytest-asyncio httpx cryptography aiosqlite==0.22.1
          # Keep the route-import test environment aligned with api/Dockerfile.
          python -m pip install './pipecat[cartesia,deepgram,openai,elevenlabs,groq,google,azure,sarvam,soundfile,silero,webrtc,speechmatics,openrouter,camb,mcp,inworld,smallest,aws-nova-sonic]'
          python -m pip uninstall -y opencv-python
          python -m pip install opencv-python-headless
      - name: Verify owner enrollment and client limits with PostgreSQL
        env:
          KODEWAVES_CLIENT_RELEASE_TEST_DATABASE_URL: postgresql+asyncpg://kodewaves_test:disposable_ci_password@127.0.0.1:5432/kodewaves_client_release_test
          DATABASE_URL: postgresql+asyncpg://kodewaves_test:disposable_ci_password@127.0.0.1:5432/kodewaves_client_release_test
          REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest --noconftest api/tests/test_client_release_postgres_integration.py -q
      - name: Verify owner issuance, identity and signed installation checks
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test
          REDIS_URL: redis://127.0.0.1:1/15
        run: >-
          python -m pytest --noconftest
          api/tests/test_client_installation_features.py
          api/tests/test_client_installation_issuance.py
          api/tests/test_client_installation_check.py
          api/tests/test_client_binding_request.py
          api/tests/test_installation_identity.py
          api/tests/test_owner_installation_database.py -q
      - name: Verify migration graph has one head
        run: |
          python scripts/check_alembic_single_head.py
          python -m pytest --noconftest api/tests/test_release_schema.py -q
      - name: Apply the full migration chain to disposable PostgreSQL
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://kodewaves_test:disposable_ci_password@127.0.0.1:5432/kodewaves_client_release_test
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python -m alembic -c api/alembic.ini upgrade head
          python -m alembic -c api/alembic.ini current
      - name: Verify installer and image-verification orchestration
        run: python -m pytest --noconftest api/tests/test_client_package.py api/tests/test_client_ci_verification.py api/tests/test_client_image_tamper_gate.py -q
      - name: Verify client backup and recovery failure handling
        run: |
          sudo setpriv --reuid 0 --regid 1234 --clear-groups "$(command -v python)" -m pytest --noconftest -p no:cacheprovider api/tests/test_client_recovery_archive.py api/tests/test_client_recovery_docker.py -q
      - name: Verify owner-route authorization
        run: ENVIRONMENT=test DATABASE_URL=postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test REDIS_URL=redis://127.0.0.1:1/15 python -m pytest --noconftest api/tests/test_deployment_edition.py -q
      - name: Verify storage metadata tenant isolation
        run: ENVIRONMENT=test DATABASE_URL=postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test REDIS_URL=redis://127.0.0.1:1/15 python -m pytest --noconftest api/tests/test_s3_signed_url.py -q
      - name: Verify client startup failure handling
        run: ENVIRONMENT=test DATABASE_URL=postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test REDIS_URL=redis://127.0.0.1:1/15 python -m pytest --noconftest api/tests/test_client_startup_entrypoint.py -q
      - name: Verify signed license and feature boundaries
        run: |
          set +e
          ENVIRONMENT=test DATABASE_URL=postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test REDIS_URL=redis://127.0.0.1:1/15 python -m pytest --noconftest api/tests/test_installation_license.py -q --junitxml="$RUNNER_TEMP/client-license-tests.xml"
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            python - "$RUNNER_TEMP/client-license-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          failures = []
          for case in root.iter("testcase"):
              failed = case.find("failure")
              if failed is None:
                  failed = case.find("error")
              if failed is not None:
                  name = case.attrib.get("name", "")
                  details = ""
                  if name == "test_openapi_data_routes_are_feature_mapped_or_explicitly_core":
                      details = " ".join(failed.attrib.get("message", "").split())[:600]
                  failures.append((f"{case.attrib.get('classname', '')}::{name}", details))
          if failures:
              for test_name, details in failures:
                  detail_suffix = f" {details}" if details else ""
                  print(f"::error title=Client licensing test failed::{test_name}{detail_suffix}")
          else:
              summaries = [
                  f"{suite.attrib.get('name', 'suite')}: failures={suite.attrib.get('failures', '0')}, errors={suite.attrib.get('errors', '0')}"
                  for suite in root.iter("testsuite")
                  if int(suite.attrib.get("failures", "0")) or int(suite.attrib.get("errors", "0"))
              ]
              detail = "; ".join(summaries) if summaries else "See pytest report for collection/setup details"
              print(f"::error title=Client licensing tests failed::{detail}")
          PY
          fi
          exit "$test_status"
      - name: Verify signed owner status and worker entitlements
        run: ENVIRONMENT=test DATABASE_URL=postgresql+asyncpg://unit:unit@127.0.0.1:1/kodewaves_unit_test REDIS_URL=redis://127.0.0.1:1/15 python -m pytest --noconftest api/tests/test_owner_installation_status.py api/tests/test_client_worker_entitlements.py -q

  owner-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Verify owner installation, shared theme and workflow UI
        working-directory: ui
        run: >-
          npm test -- --config vitest.panel-check.mts --run
          'src/app/handler/[...stack]/stack-theme.test.ts'
          src/app/admin/client-installations/page.test.tsx
          src/app/admin/settings/page.test.tsx
          src/app/settings/page.test.tsx
          src/app/page.test.tsx
          src/app/pricing/page.test.tsx
          src/app/widgets/page.test.tsx
          src/components/BrandTagline.test.tsx
          src/components/telephony/SipConnectivityCard.test.tsx
          src/components/layout/AppLayout.test.tsx
          'src/app/workflow/[workflowId]/run/[runId]/components/ConnectionStatus.test.tsx'
          'src/app/workflow/[workflowId]/components/workflow-tester/EmbeddedVoiceTester.test.tsx'
          src/lib/brandingTheme.test.ts

  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/client-bundle-theme' || github.ref == 'refs/heads/codex/kodewaves-shared-work'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release verification dependencies
        run: python -m pip install cryptography 'sqlalchemy==2.0.43' 'PyYAML==6.0.2'
      - name: Check release tool imports
        run: |
          python deploy/client/build_and_verify.py --help > /dev/null
          python deploy/client/ci_verify.py --help > /dev/null
          python owner-tools/package_client_installer.py --help > /dev/null
      - name: Build and verify client images with temporary keys
        env:
          CADDY_IMAGE: ${{ inputs.caddy_image || 'caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f' }}
        run: >-
          python deploy/client/ci_verify.py
          --caddy-image "$CADDY_IMAGE"
          --report "$RUNNER_TEMP/client-verification.json"
      - name: Preserve verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: client-image-verification-${{ github.sha }}
          path: ${{ runner.temp }}/client-verification.json
          if-no-files-found: error
          retention-days: 14
